# OG Worker P0 non-deploying development adapter.
# Production credentials, deployment, dry-run, and Worker runtime changes stay disabled.

# GitHub cutback: predecessor pipelines remain disabled.
workflow:
  rules:
    - when: never

stages:
  - verify

default:
  interruptible: true

worker_verify:
  stage: verify
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  script:
    - npm ci --cache .npm --prefer-offline --include=optional
    - npm test
    - npm run typecheck
    - git diff --check
